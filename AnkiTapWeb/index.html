<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnkiTap Web</title>
  <link rel="stylesheet" href="style.css?v=20261006-past-favorites">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script defer src="MathJax/tex-svg.js"></script>
  <script defer src="app.js?v=20261006-past-favorites"></script>
</head>
<body>
  <main class="app-shell">
    <header class="top-bar">
      <button class="icon-button hidden" id="backToCategories" type="button" aria-label="カテゴリへ戻る">
        <span aria-hidden="true">≡</span>
      </button>
      <h1>暗記カード</h1>
      <button class="icon-button" id="shuffleButton" type="button" aria-label="ランダムに並べ替える" disabled>
        <span aria-hidden="true">↬</span>
      </button>
    </header>

    <section class="mode-view" id="modeView">
      <h2>学習モードを選択</h2>
      <div class="mode-list">
        <button class="mode-card" id="formulaModeButton" type="button">
          <strong>公式・論説暗記</strong>
          <span>cards.csv のカードをカテゴリ別に練習</span>
        </button>
        <button class="mode-card" id="pastQuestionModeButton" type="button">
          <strong>過去問モード</strong>
          <span>denken_questions.tsv の問題を段階表示</span>
        </button>
        <button class="mode-card" id="printReviewModeButton" type="button">
          <strong>印刷レビュー</strong>
          <span>過去問データをA4確認用に一覧表示</span>
        </button>
      </div>
    </section>

    <section class="formula-view-tools hidden" id="formulaViewTools" aria-label="公式・論説暗記の表示設定">
      <div class="formula-view-switch" role="group" aria-label="表示方法">
        <button id="formulaCardViewButton" type="button" aria-pressed="true">カード</button>
        <button id="formulaListViewButton" type="button" aria-pressed="false">リスト</button>
      </div>
      <label class="formula-category-filter">
        <span>カテゴリ</span>
        <select id="formulaCategorySelect" aria-label="公式・論説暗記のカテゴリ">
          <option value="">カテゴリを選択</option>
        </select>
      </label>
    </section>

    <section class="category-view hidden" id="categoryView">
      <h2>カテゴリを選択</h2>
      <label class="favorite-only-toggle">
        <input id="favoriteOnlyToggle" type="checkbox">
        <span class="favorite-only-check" aria-hidden="true">★</span>
        <span>お気に入りのみ<span id="favoriteOnlyCount">（0）</span></span>
      </label>
      <div class="category-list" id="categoryList"></div>
    </section>

    <section class="card-list-view hidden" id="cardListView" aria-label="公式・論説暗記のリスト">
      <div class="card-list-filter-bar">
        <label class="card-list-search">
          <span>検索</span>
          <input id="cardListSearch" type="search" placeholder="問題・解答・解説を検索" autocomplete="off">
        </label>
        <label class="favorite-only-toggle card-list-favorite-toggle">
          <input id="cardListFavoriteOnlyToggle" type="checkbox">
          <span class="favorite-only-check" aria-hidden="true">★</span>
          <span>お気に入りのみ</span>
        </label>
      </div>
      <div class="card-list-summary">
        <strong id="cardListCondition">すべて</strong>
        <span id="cardListCount" aria-live="polite">0件</span>
      </div>
      <p class="card-list-empty hidden" id="cardListEmpty" role="status"></p>
      <ol class="card-list" id="cardList"></ol>
    </section>

    <section class="past-filter-view hidden" id="pastFilterView">
      <h2>過去問を選択</h2>
      <label class="favorite-only-toggle">
        <input id="pastFavoriteOnlyToggle" type="checkbox">
        <span class="favorite-only-check" aria-hidden="true">★</span>
        <span>お気に入りのみ<span id="pastFavoriteOnlyCount">（0）</span></span>
      </label>
      <div class="past-filter-list" id="pastFilterList"></div>
      <p class="card-list-empty hidden" id="pastFilterEmpty" role="status">お気に入りの過去問はまだありません。</p>
    </section>

    <section class="study-view hidden" id="studyView">
      <div class="progress-panel">
        <div class="progress-row">
          <strong id="cardCounter">1 / 1</strong>
          <span id="cardState">出題中</span>
        </div>
        <progress id="progressBar" value="1" max="1"></progress>
        <div class="debug-meta hidden" id="debugMeta"></div>
      </div>

      <button
        class="favorite-button hidden"
        id="favoriteButton"
        type="button"
        aria-pressed="false"
        aria-label="このカードをお気に入りに登録"
      >
        <span class="favorite-star" id="favoriteStar" aria-hidden="true">☆</span>
        <span id="favoriteButtonText">お気に入り</span>
      </button>

      <button class="card" id="cardButton" type="button">
        <span class="category-pill" id="cardCategory"></span>
        <span class="mode-label" id="modeLabel">問題</span>
        <span class="card-content math" id="cardContent"></span>
        <span class="tap-hint" id="tapHint">タップして回答を表示</span>
      </button>

      <button class="explanation-button hidden" id="explanationButton" type="button">解説を表示</button>

      <nav class="nav-buttons">
        <button id="previousButton" type="button">前へ</button>
        <button id="nextButton" type="button">次へ</button>
      </nav>
    </section>

    <section class="past-study-view hidden" id="pastStudyView">
      <div class="progress-panel">
        <div class="progress-row past-progress-row">
          <strong id="pastCounter">1 / 1</strong>
          <span id="pastSubject">過去問</span>
          <button class="past-favorite-button" id="pastFavoriteButton" type="button"
            aria-pressed="false" aria-label="この問題をお気に入りに登録"
            title="この問題をお気に入りに登録"><span id="pastFavoriteStar" aria-hidden="true">☆</span></button>
        </div>
        <div class="debug-meta hidden" id="pastDebugMeta"></div>
        <div class="review-status-meta hidden" id="pastReviewStatus"></div>
      </div>

      <section class="past-question-panel" aria-label="問題">
        <div class="past-section-label">問題文</div>
        <div class="past-question-text math" id="pastQuestionText"></div>
        <div class="past-section-label" id="pastQuestionImageLabel">問題図</div>
        <div class="past-question-image" id="pastQuestionImage"></div>
      </section>

      <section class="past-answer-panel" aria-label="解答表示">
        <div class="past-tabs" id="pastTabs"></div>
        <div class="past-answer-content math" id="pastAnswerContent"></div>
      </section>

      <nav class="nav-buttons">
        <button id="pastPreviousButton" type="button">前へ</button>
        <button id="pastNextButton" type="button">次へ</button>
      </nav>
    </section>

    <section class="print-review-view hidden" id="printReviewView">
      <div class="print-review-toolbar">
        <h2>印刷レビュー</h2>
        <div class="print-filter-grid">
          <label>
            <span>year</span>
            <select id="printYearFilter"></select>
          </label>
          <label>
            <span>subject</span>
            <select id="printSubjectFilter"></select>
          </label>
          <label>
            <span>review_status</span>
            <select id="printReviewStatusFilter"></select>
          </label>
        </div>
        <div class="print-toolbar-actions">
          <span id="printReviewCount">0問</span>
          <button id="printButton" type="button">印刷</button>
        </div>
      </div>
      <div class="print-review-pages" id="printReviewPages"></div>
    </section>

    <section class="empty-view hidden" id="emptyView">
      <h2 id="emptyTitle">カードがありません</h2>
      <p id="emptyMessage">cards.csvを読み込み中です。</p>
      <div class="empty-actions hidden" id="favoriteEmptyActions">
        <button id="disableFavoriteOnlyButton" type="button">お気に入りのみを解除</button>
        <button id="emptyBackToCategoriesButton" type="button">カテゴリ選択へ戻る</button>
      </div>
    </section>
  </main>

  <dialog class="explanation-dialog" id="explanationDialog">
    <div class="dialog-header">
      <h2>公式の解説</h2>
      <button class="icon-button" id="closeExplanation" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="explanation-content" id="explanationContent"></div>
    <div class="dialog-footer">
      <button id="closeExplanationFooter" type="button" aria-label="解説を閉じる">閉じる</button>
      <button class="primary" id="nextFromExplanation" type="button" aria-label="解説を閉じて次の問題へ進む">次の問題</button>
    </div>
  </dialog>
</body>
</html>
